[project]
name = "coreldraw-live-mcp"
version = "0.3.2"
description = "Safe live CorelDRAW editing through a local MCP server"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "深圳市玄熵智能科技有限责任公司", email = "wuguirong@gmail.com" },
    { name = "dhxg" },
]
keywords = ["coreldraw", "mcp", "ai-agent", "automation", "signage", "com"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12.3,<4",
    "pywin32>=306,<312; sys_platform == 'win32'",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]
agent = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "streamlit>=1.35.0",
]
datamerge = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "qrcode[pil]>=7.4.0",
    "python-barcode>=0.15.0",
    "Pillow>=10.0.0",
]
https = [
    "cryptography>=42.0.0",
    "uvicorn>=0.30.0",
]
all = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "qrcode[pil]>=7.4.0",
    "python-barcode>=0.15.0",
    "Pillow>=10.0.0",
    "cryptography>=42.0.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F821", "F823", "B023"]
